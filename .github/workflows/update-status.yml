name: Update Status

on:
  workflow_dispatch:
    inputs:
      status:
        description: "What's your current status?"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update status history
        env:
          STATUS_TEXT: ${{ inputs.status }}
        run: python scripts/update_status.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/statuses.json
          git diff --cached --quiet || (git commit -m "Update status" && git push)
